[project]
name = "chat-cli"
version = "0.1.0"
description = "ChatGPT API CLI"
authors = [{ name = "caru-ini", email = "caru17122@gmail.com" }]
requires-python = "~=3.12"
readme = "README.md"
dependencies = [
    "openai>=1.41.0,<2",
    "rich>=13.7.1,<14",
    "pydantic>=2.8.2,<3",
    "python-dotenv>=1.0.1,<2",
    "prompt-toolkit>=3.0.47,<4",
    "duckduckgo-search>=6.2.11,<7",
]

[project.scripts]
main = "chat_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
